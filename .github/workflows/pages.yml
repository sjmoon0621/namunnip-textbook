# exams/img는 Git LFS라 실제 파일을 받아야 한다. checkout의 lfs: true는 캐시보다 먼저 전부 내려받아
# 캐시가 소용없으므로, 포인터만 체크아웃 → .git/lfs 캐시 복원 → git lfs pull(빠진 것만) 순서로 받는다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS 객체 목록(캐시 키)
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: lfs-

      - name: LFS 실제 파일 받기
        run: |
          git lfs pull
          head -c 12 exams/img/20231116-go3-csat-phy1/10.webp | od -c | head -1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
