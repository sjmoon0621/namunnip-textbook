<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개념 지도 — 나뭇잎 과학 교과서</title>
  <meta name="description" content="교과서의 모든 카드를 개념으로 묶고, 어떤 개념을 먼저 알아야 하는지 화살표로 이은 지도. 내가 본 카드와 틀린 문제가 색으로 표시됩니다.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tb.css">
</head>
<body data-view="graph" class="gv-body">

<header class="top">
  <a class="brand" href="./"><svg class="brand-mark"><use href="#nm"/></svg>나뭇잎 과학 교과서</a>
  <nav class="crumbs" aria-label="위치"><span aria-hidden="true">/</span><b>개념 지도</b></nav>
  <div class="top-right"><a href="notes.html">내 노트</a><a href="./">← 전체 목차</a></div>
</header>

<main class="gv">
  <div class="gv-stage">
    <canvas id="gv-canvas" aria-label="개념 지도. 원은 개념, 화살표는 먼저 알아야 할 개념에서 다음 개념으로 이어진다."></canvas>
    <div class="gv-tools">
      <input type="search" id="gv-search" placeholder="개념이나 카드 제목 찾기" aria-label="개념 찾기">
      <div class="gv-courses" id="gv-courses" role="group" aria-label="과목 골라 보기"></div>
      <div class="gv-zoom">
        <button type="button" data-z="in" aria-label="확대">+</button><button type="button" data-z="out" aria-label="축소">−</button><button type="button" data-z="fit">전체 보기</button>
      </div>
    </div>
    <details class="gv-legend" open>
      <summary class="mono">읽는 법</summary>
      <ul>
        <li><i class="lg-ring"></i>원 하나가 개념 하나. 테두리 색은 과목, 원이 클수록 카드가 많습니다.</li>
        <li><i class="lg-fill"></i>안쪽이 찬 만큼 그 개념의 카드를 본 것입니다.</li>
        <li><i class="lg-dot"></i>빨간 점은 오답노트에 남은 문제가 있다는 뜻입니다.</li>
        <li><i class="lg-arrow"></i>화살표는 먼저 알면 좋은 개념 → 다음 개념.</li>
      </ul>
    </details>
  </div>
  <aside class="gv-panel" id="gv-panel" hidden>
    <button type="button" class="gv-close" aria-label="닫기">×</button>
    <div id="gv-detail"></div>
  </aside>
</main>

<script src="js/toc.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/graph-data.js"></script>
<script src="js/graph.js"></script>
</body>
</html>
