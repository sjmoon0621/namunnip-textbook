<p class="lead">뉴런의 휴지 전위와 활동 전위는 이온 농도가 아니라 막이 어떤 이온을 얼마나 통과시키느냐가 바뀌어 생깁니다. 네른스트 식과 골드만 식으로 막전위를 계산하고, 호지킨과 헉슬리의 모형으로 활동 전위와 불응기를 직접 만들어 봅니다. 말이집이 손상되면 전도가 어떻게 무너지는지도 살펴봅니다.</p>
