<p class="lead">"\(n^2\)이 짝수이면 \(n\)은 짝수이다"를 곧바로 증명하려 하면 막힙니다. \(n^2\)에서 \(n\)으로 거슬러 가는 길이 없기 때문입니다. 이 절에서는 대우로 바꾸어 증명하는 방법과, 결론을 부정하면 모순이 생긴다는 것을 보여 증명하는 귀류법을 익힙니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">명제와 대우</span><span class="p">나머지와 배수</span><span class="p">유리수와 무리수</span>
</div>
