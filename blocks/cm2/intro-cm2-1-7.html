<p class="lead">거울에 비친 모습처럼 도형을 한 직선이나 한 점을 기준으로 뒤집어 옮기는 것을 대칭이동이라고 합니다. 이 절에서는 원점, \(x\)축, \(y\)축, 직선 \(y = x\)에 대해 점과 도형을 대칭이동하고, 좌표와 방정식이 어떻게 바뀌는지 찾습니다. 그리고 대칭이동으로 가장 짧은 길을 찾는 문제를 풉니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">선분의 중점</span><span class="p">두 직선의 수직 조건</span><span class="p">평행이동한 도형의 방정식</span><span class="p">두 점 사이의 거리</span>
</div>
