<p class="lead">하나의 함수에서 나온 값을 다른 함수에 다시 넣으면 새로운 함수가 생깁니다. 이 절에서는 화살표 그림으로 두 함수를 이어 붙이는 과정을 따라가며 합성함수의 뜻을 익히고, 순서를 바꾸면 결과가 달라지는지 확인합니다. 이어서 일차함수와 이차함수를 합성해 식과 값을 구하고, 그래프 위에서도 그 값을 찾아봅니다.</p>
