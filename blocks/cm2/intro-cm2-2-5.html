<p class="lead">"4의 배수이면 짝수이다"는 참이지만 "짝수이면 4의 배수이다"는 거짓입니다. 가정과 결론의 자리를 바꾸거나 부정하면 새 명제가 생기는데, 그 가운데 원래 명제와 참·거짓이 언제나 같은 것이 있습니다. 이 절에서는 역과 대우를 만들고, 그 참·거짓을 진리집합으로 비교합니다.</p>
