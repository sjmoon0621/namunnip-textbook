<p class="lead">원과 직선은 두 점에서 만나거나, 한 점에서 닿거나(접함), 만나지 않습니다. 이 절에서는 그림을 그리지 않고 이 셋을 구별하는 방법 두 가지를 비교합니다. 하나는 방정식을 연립해 판별식을 보는 방법이고, 다른 하나는 중심에서 직선까지의 거리를 반지름과 비교하는 방법입니다. 마지막으로 원에 접하는 직선의 방정식을 구합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>

</div>
