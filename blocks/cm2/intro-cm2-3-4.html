<p class="lead">반비례 관계 \(y = \frac{k}{x}\)는 중학교에서 그려 보았습니다. 이 절에서는 분모에 \(x\)가 들어 있는 식, 곧 유리식으로 정해지는 함수를 다룹니다. 그래프가 한없이 가까워지는 직선인 점근선을 찾고, 평행이동과 식 고치기로 어떤 유리함수의 그래프든 \(y = \frac{k}{x}\)에서 출발해 그려 봅니다.</p>
