<p class="lead">\(x^2 \ge x\)는 \(x = \frac{1}{2}\)에서 깨지지만, \(x^2 + 1 \ge 2x\)는 어떤 실수를 넣어도 깨지지 않습니다. 이 절에서는 변수에 어떤 실수를 넣어도 성립하는 부등식을 구별하고, 그 사실을 완전제곱식과 평균의 비교로 증명합니다.</p>
