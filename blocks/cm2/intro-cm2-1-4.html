<p class="lead">원은 한 점에서 같은 거리에 있는 점들의 모임입니다. 두 점 사이의 거리 공식을 쓰면 이 성질을 \(x, y\)에 대한 방정식 하나로 적을 수 있습니다. 이 절에서는 중심과 반지름으로 원의 방정식을 세우고, 전개된 식에서 거꾸로 중심과 반지름을 찾아 그래프를 그립니다.</p>
