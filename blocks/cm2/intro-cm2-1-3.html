<p class="lead">점에서 직선까지 갈 수 있는 길은 무수히 많지만, 그중 가장 짧은 길은 하나입니다. 이 절에서는 그 길이 직선에 수직임을 확인하고, 수직 조건과 두 점 사이의 거리를 이어 점과 직선 사이의 거리 공식을 얻습니다. 이 공식으로 꼭짓점의 좌표만 아는 삼각형의 넓이도 구합니다.</p>
