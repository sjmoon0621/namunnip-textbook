<p class="lead">중학교에서 일차함수의 그래프는 기울기와 \(y\)절편으로 정해진다고 배웠습니다. 이 절에서는 두 직선의 기울기를 비교해서 평행한지, 겹치는지, 수직으로 만나는지를 판단합니다. 그리고 \(ax + by + c = 0\) 꼴로 쓴 직선에서도 같은 판단을 할 수 있게 조건을 넓힙니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">일차함수의 기울기와 \(y\)절편</span><span class="p">연립일차방정식</span><span class="p">직선의 방정식</span>
</div>
