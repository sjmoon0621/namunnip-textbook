<section class="video-block" id="video-is1-meter" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 32초</span>
    <h2>1미터의 역사</h2>
    <p>1미터는 처음에 지구 크기에서 정했습니다. 그다음에는 금속 막대 하나, 원자가 내는 빛의 파장, 그리고 지금은 빛의 속력과 1초로 정합니다.
      기준이 왜 계속 바뀌었는지, 32초 동안 따라가 봅니다. 이 영상도 파일이 아니라 코드로 그려집니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="1미터의 정의가 지구 자오선, 미터 원기, 크립톤 빛의 파장, 빛의 속력으로 바뀌어 온 과정을 보여 주는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
