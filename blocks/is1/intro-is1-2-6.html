<p class="lead">구리선은 전기를 잘 통하고, 유리와 플라스틱은 거의 통하지 않습니다. 그 사이에 규소 같은 반도체가 있습니다. 전기가 얼마나 잘 통하는지는 움직일 수 있는 전자가 얼마나 많은지로 정해집니다. 그 수를 정하는 띠틈과 온도, 그리고 불순물의 역할을 차례로 봅니다.</p>
