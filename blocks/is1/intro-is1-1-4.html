<p class="lead">온도, 빛, 소리 같은 자연의 변화는 연속적으로 바뀝니다. 컴퓨터는 이것을 띄엄띄엄한 숫자로만 다룰 수 있습니다. 이 절에서는 센서가 자연의 변화를 전기 신호로 바꾸고, 그 신호가 숫자가 되는 과정을 단계별로 따라가며, 그 과정에서 무엇을 잃는지 살펴봅니다.</p>
