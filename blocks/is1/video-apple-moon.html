<section class="video-block" id="video-apple-moon" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 30초</span>
    <h2>달도 떨어지고 있다</h2>
    <p>사과는 1초에 4.9 m, 달은 1초에 1.36 mm 떨어집니다. 두 숫자의 비는 약 3600, 곧 60². 달이 사과보다 지구 중심에서 60배 멀기 때문입니다.
      카드 2.2의 그래프에서 ‘달’ 점이 직선 위에 놓이는 이유를 30초로 봅니다. 이 영상도 파일이 아니라 코드로 그려집니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="사과와 달이 같은 법칙으로 떨어진다는 것을 보여 주는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
