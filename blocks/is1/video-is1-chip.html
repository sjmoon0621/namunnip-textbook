<section class="video-block" id="video-is1-chip" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 32초</span>

    <p>규소는 지각에서 산소 다음으로 많은 원소입니다. 흔한 모래에서 산소를 떼어 내고, 불순물을 10억 분의 1 아래로 걸러 낸 뒤, 다시 원하는 불순물을 정확한 양만큼 넣습니다. 두 카드의 내용이 실제 공정에서 어떻게 쓰이는지 32초로 봅니다. 이 영상도 코드로 그려집니다.</p>
