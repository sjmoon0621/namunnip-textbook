<p class="lead">별에 가 본 사람은 없지만, 우리는 별이 무엇으로 이루어졌는지 압니다. 빛을 파장별로 펼치면 원소마다 다른 선이 나타나기 때문입니다. 이 절에서는 그 선을 읽는 방법과, 그렇게 읽은 우주가 왜 수소와 헬륨으로 가득한지를 살펴봅니다.</p>
