<p class="lead">추출해서 얻은 카페인 용액 100 mL에서 용매만 날려 보내려면 끓여야 합니다. 그런데 열에 약한 물질은 높은 온도에서 망가집니다. 압력을 낮추면 40 °C 물중탕으로도 용매를 빠르게 끓일 수 있습니다.</p>
