<p class="lead">티오사이안산 이온과 철(III) 이온을 섞으면 피처럼 붉은 색이 생깁니다. 색의 진하기를 숫자로 재면 용액 속 이온의 농도를 알 수 있고, 섞는 양을 아무리 바꿔도 변하지 않는 값 하나가 드러납니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">평형 상수와 반응 지수</span><span class="p">르샤틀리에 원리</span><span class="p">빛의 흡수와 용액의 색</span>
</div>
