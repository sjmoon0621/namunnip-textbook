<p class="lead">생물의 몸을 이루는 탄소와 질소는 생물과 환경 사이를 돌고 돕니다. 그런데 에너지는 한 번 지나가면 돌아오지 않습니다. 탄소와 질소의 길을 따라가 보고, 에너지가 영양 단계를 거치며 어디로 사라지는지 따져 봅니다.</p>
