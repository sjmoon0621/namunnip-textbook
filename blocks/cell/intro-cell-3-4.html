<p class="lead">산소가 모자라면 세포는 해당 과정만으로 버팁니다. 그런데 해당 과정을 계속 돌리려면 NADH를 다시 NAD⁺로 바꿔 줄 곳이 필요합니다. 효모와 젖산균, 근육 세포가 이 문제를 푸는 방법이 발효입니다. 산소 호흡과 발효를 비교하고, 발효가 음식과 생활에 어떻게 쓰이는지 조사해 봅니다.</p>
