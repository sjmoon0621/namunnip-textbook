<p class="lead">세포 안은 막으로 나뉜 여러 방으로 되어 있고, 방마다 맡은 일이 다릅니다. 그런데 지름 몇 μm짜리 방에서 무슨 일이 일어나는지 어떻게 알았을까요? 전자 현미경으로 모양을 보고, 세포를 갈아 원심 분리해 기능을 재고, 방사성 표지로 물질의 이동 경로를 쫓아 알아냈습니다. 세 방법을 차례로 써 보며 소기관들이 한 가지 물질을 만들고 내보내기 위해 어떻게 협력하는지 추론합니다.</p>
