<p class="lead">광합성은 한 번에 일어나는 반응이 아니라, 빛에너지를 화학 에너지로 바꾸는 명반응과 그 에너지로 CO₂를 당으로 바꾸는 탄소 고정 반응이 맞물린 과정입니다. 두 반응이 무엇을 주고받는지, 한쪽을 멈추면 다른 쪽에 무슨 일이 생기는지 따져 보며 두 반응의 관계를 추론합니다.</p>
