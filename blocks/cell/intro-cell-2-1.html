<p class="lead">세포 속에서는 1초에도 수많은 화학 반응이 일어납니다. 어떤 반응은 큰 분자를 만들며 에너지를 흡수하고, 어떤 반응은 분자를 쪼개며 에너지를 내놓습니다. 두 종류의 반응이 어떻게 에너지를 주고받는지, 그리고 몸 전체로 보면 먹는 에너지와 쓰는 에너지의 균형이 왜 중요한지 알아봅니다.</p>
