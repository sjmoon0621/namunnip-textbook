<p class="lead">밥, 설탕, 종이, 버터, 세포막, 성호르몬은 서로 전혀 달라 보이지만 모두 탄수화물이나 지질입니다. 작은 단위가 어떻게 이어지고 어떤 모양을 하느냐에 따라 에너지원도 되고 구조물도 됩니다. 생물체에 들어 있는 탄수화물과 지질을 종류별로 정리하고, 직접 검출하는 방법도 알아봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">공유 결합과 단일·이중 결합</span><span class="p">단위체와 중합체</span><span class="p">물과 잘 섞이는 분자, 섞이지 않는 분자</span>
</div>
