<section class="video-block" id="video-phy-bus" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 29초</span>
    <h2>급정거한 버스 안에서</h2>
    <p>버스가 급히 서면 몸이 앞으로 쏠립니다. 누가 나를 앞으로 민 걸까요? 버스 밖에서 보면 답이 달라집니다. 초속 10 m로 달리던 버스가 2.5초 만에 설 때 몸에 무슨 일이 일어나는지 29초로 봅니다. 이 영상도 파일이 아니라 코드로 그려집니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="급정거와 출발 때 승객의 몸이 쏠리는 까닭을 관성으로 설명하는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
