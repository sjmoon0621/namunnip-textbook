<section class="video-block" id="video-phy-speaker" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 32초</span>
    <h2>스피커를 분해하면</h2>
    <p>스피커 속에는 자석과 코일, 종이 콘이 있습니다. 코일에 흐르는 전류가 방향을 바꿀 때마다 자석이 코일을 앞뒤로 밀고, 콘이 공기를 흔들어 소리를 냅니다. 카드 2.5.2의 F = BIL이 전동기에서는 회전으로, 스피커에서는 떨림으로 쓰입니다. 이 영상도 파일이 아니라 코드로 그려집니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="스피커의 구조와, 코일이 받는 힘이 콘을 떨게 해 소리를 내는 과정을 보여 주는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
