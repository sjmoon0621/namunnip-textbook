<p class="lead">공유 결합의 전자쌍은 두 원자가 똑같이 나눠 갖지 않는 경우가 많습니다. 한쪽이 더 세게 당기면 결합에 전하의 치우침이 생깁니다. 이 절에서는 그 당기는 힘을 수로 나타낸 전기 음성도와, 결합의 치우침이 모여 분자 전체의 극성을 정하는 방식을 봅니다.</p>
