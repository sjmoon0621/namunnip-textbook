<section class="video-block" id="video-chem-altitude" aria-label="통통사과 영상">
  <div>
    <span class="mono">영상 · 통통사과 · 30초</span>
    <h2>높은 산에 오르면 왜 숨이 찰까</h2>
    <p>혈액의 헤모글로빈은 폐에서 산소와 결합하고 조직에서 내려놓습니다. 해발 4,000 m에서는 폐 속 산소 분압이 절반쯤으로 떨어져 이 평형이 왼쪽으로 이동합니다.
      몸은 몇 주에 걸쳐 헤모글로빈을 늘려 평형을 다시 오른쪽으로 돌려놓습니다. 르샤틀리에 원리가 몸 안에서 일어나는 모습을 30초로 봅니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="고도에 따라 헤모글로빈의 산소 결합 평형이 이동하는 모습을 보여 주는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
