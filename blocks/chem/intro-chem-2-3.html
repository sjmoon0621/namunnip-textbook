<p class="lead">분자 속 원자가 전자가 어디에 있는지를 점으로 나타내면, 어느 원자끼리 몇 쌍을 나누는지와 어떤 전자쌍이 결합에 쓰이지 않고 남는지가 보입니다. 이 전자쌍들이 서로 밀어내는 방식이 분자의 모양을 정합니다. 이 절에서는 전자점식을 그리는 규칙과, 그 그림에서 입체 모양을 예측하는 방법을 봅니다.</p>
