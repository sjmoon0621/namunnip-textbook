<p class="lead">여름마다 강과 호수가 초록 물감을 풀어 놓은 듯 변합니다. 몇 종의 식물 플랑크톤이 폭발적으로 늘면 물속의 다른 생물은 어떻게 될까요? 영양염, 수온, 물의 흐름을 바꿔 가며 녹조가 생기는 조건을 찾아봅니다.</p>
