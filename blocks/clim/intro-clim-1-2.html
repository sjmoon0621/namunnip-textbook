<p class="lead">CO₂만 늘려 계산하면 지구는 1 °C 남짓 데워지는 데 그칩니다. 그런데 실제 예상은 그 두세 배입니다. 수증기와 얼음, 구름, 그리고 생물이 변화를 키우거나 줄이는 되먹임 때문입니다. 간단한 에너지 균형 모형과 가상의 데이지 세계로 기후 시스템이 어떻게 균형을 유지하고 어떻게 흔들리는지 알아봅니다.</p>
