<p class="lead">열대 바다의 산호초가 하얗게 변하고, 우리나라 동해와 제주 바닷속 바위에서는 미역과 감태 숲이 사라지고 있습니다. 둘 다 바다가 따뜻해지면서 생긴 일입니다. 바닷물 온도가 얼마나, 얼마나 오래 올라야 생태계가 무너지는지, 그리고 사라진 바다숲을 되살릴 방법은 무엇인지 알아봅니다.</p>
