<p class="lead">"오늘 춥다"는 날씨이고 "서울의 겨울은 춥다"는 기후입니다. 두 말은 비슷해 보여도 다루는 시간의 길이가 다르고, 기후 변화를 판단하는 기준도 여기에서 나옵니다. 서울의 65년 기온 자료와 다섯 도시의 기후 그래프로 날씨와 기후, 그리고 기후를 정하는 요인을 살펴봅니다.</p>
