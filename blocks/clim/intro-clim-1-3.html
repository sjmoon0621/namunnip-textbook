<p class="lead">북극의 여름 바다 얼음은 위성 관측을 시작한 1979년보다 크게 줄었고, 우리 바다의 수온과 사과밭의 위치, 여름 폭염의 모습도 달라졌습니다. 실제 관측 자료로 변화의 크기를 재 보고, 국내외 사례를 조사해 기후가 원인이라는 근거와 다른 원인을 함께 따지는 방법을 익힙니다.</p>
