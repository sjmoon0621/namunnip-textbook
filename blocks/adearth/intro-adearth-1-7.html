<p class="lead">한 덩어리의 현무암질 마그마에서 반려암과 화강암이 함께 나오기도 하고, 같은 현무암이 섭입대에서는 청색 편암, 조산대에서는 각섬암이 됩니다. 암석의 이름은 그 암석이 겪은 온도, 압력, 환경의 기록입니다. 상평형 그림을 읽어 그 기록을 해독하고, 같은 과정에서 지하자원이 어떻게 모이는지 알아봅니다.</p>
