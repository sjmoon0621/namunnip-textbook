<p class="lead">안개와 구름은 모두 공기 속 수증기가 작은 물방울이 된 것입니다. 그런데 안개는 땅에 닿아 생기고 구름은 하늘 높이 생기며, 어떤 구름은 비를 뿌리고 어떤 구름은 그냥 흩어집니다. 수증기가 물방울로, 다시 빗방울로 바뀌는 길을 따라가 봅니다.</p>
