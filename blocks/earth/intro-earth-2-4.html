<p class="lead">암석은 한 번 생기면 끝이 아닙니다. 끌려가 부러지고, 눌려 휘고, 녹지 않은 채 다른 암석으로 바뀌기도 합니다. 이 절에서는 힘과 열이 암석을 어떻게 바꾸는지, 그리고 그 변화가 어떻게 이어지는지 봅니다.</p>
