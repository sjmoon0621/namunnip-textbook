<p class="lead">숫자 1, 2, 3만 쓰는 네 자리 비밀번호에서는 같은 숫자를 여러 번 써도 됩니다. 반대로 BANANA의 글자를 늘어놓을 때는 같은 글자끼리 자리를 바꾸어도 새 배열이 생기지 않습니다. 이 절에서는 순열의 두 가지 변형인 중복순열과 같은 것이 있는 순열을 다룹니다. 두 경우의 수가 왜 각각 곱셈과 나눗셈으로 구해지는지 따져 보고, 바둑판 모양 길의 최단 경로를 세는 데 써 봅니다.</p>
