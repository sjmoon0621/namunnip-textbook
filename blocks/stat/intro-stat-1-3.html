  "type": "intro",
  "description": "이항정리 (a + b)^n = Σ nCr a^(n−r) b^r, 이항계수, 파스칼의 삼각형과 그 성질(두 수의 합, 행의 합 2^n, 대각선 합), 특정 항의 계수와 계수의 합, 근삿값. 인수마다 a, b를 골라 보고 삼각형을 눌러 보는 카드."
}

<p class="lead">(<i>a</i> + <i>b</i>)<sup>2</sup>, (<i>a</i> + <i>b</i>)<sup>3</sup>은 직접 전개할 수 있습니다. 그러나 (<i>a</i> + <i>b</i>)<sup>10</sup>을 하나씩 곱해 나가기는 어렵습니다. 그런데 전개식의 계수는 사실 경우의 수입니다. 열 개의 인수에서 <i>a</i>와 <i>b</i> 가운데 무엇을 고를지 세면 계수가 나옵니다. 이 절에서는 이 생각으로 이항정리를 얻고, 계수들을 쌓은 파스칼의 삼각형의 성질을 찾은 뒤 특정한 항의 계수와 근삿값 계산에 써 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">다항식의 곱셈과 곱셈 공식</span><span class="p">조합 <sub><i>n</i></sub>C<sub><i>r</i></sub>와 그 성질</span><span class="p">같은 것이 있는 순열</span>
</div>
