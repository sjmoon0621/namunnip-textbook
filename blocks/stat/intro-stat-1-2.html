<p class="lead">과일 가게에서 사과, 배, 감 가운데 5개를 산다고 합시다. 같은 과일을 여러 개 골라도 되고, 고르는 순서는 상관없습니다. 이처럼 중복을 허락하되 순서를 따지지 않는 선택이 중복조합입니다. 이 절에서는 중복조합을 공과 칸막이의 배열로 바꾸어 그 수가 \({}_{n+r-1}\mathrm{C}_{r}\)가 되는 까닭을 확인합니다. 같은 생각으로 방정식의 정수해 개수를 세 봅니다.</p>
