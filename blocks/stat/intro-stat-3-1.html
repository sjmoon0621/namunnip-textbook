<p class="lead">동전 세 개를 던진 결과는 '앞뒤앞' 같은 글자입니다. 그런데 우리가 궁금한 것은 대개 '앞면이 몇 개인가' 같은 수입니다. 이 절에서는 결과마다 수를 하나씩 붙이는 확률변수를 만들고, 그 수가 어떤 확률로 나오는지 정리한 확률분포를 표와 그래프로 봅니다. 대기 시간처럼 값이 연속으로 변하면 확률을 넓이로 잽니다.</p>
