<p class="lead">키, 측정 오차, 시험 점수처럼 많은 자료가 평균 근처에 몰리고 양쪽으로 갈수록 드물어지는 종 모양을 이룹니다. 이 절에서는 이런 모양을 나타내는 정규분포가 평균과 표준편차 두 수로 정해지는 것을 보고, 어떤 정규분포든 표준정규분포 하나로 바꾸어 확률을 구하는 방법을 익힙니다. 시행 횟수가 많은 이항분포가 정규분포에 가까워지는 것도 확인합니다.</p>
