<p class="lead">주머니에서 공을 연달아 두 번 꺼낼 때 두 번 모두 빨간 공일 확률은, 첫째가 빨간 공일 확률에 '첫째가 빨간 공이었을 때' 둘째가 빨간 공일 확률을 곱해 얻습니다. 이 절에서는 조건부확률의 정의를 곱셈 꼴로 바꾼 확률의 곱셈정리를 나뭇가지 그림으로 익힙니다. 같은 시행을 서로 영향 없이 되풀이하는 독립시행에서는 이 곱셈이 일정한 규칙을 이룹니다.</p>
