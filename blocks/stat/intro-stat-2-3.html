<p class="lead">'적어도 한 명', '적어도 한 개'가 들어간 확률은 경우를 하나하나 나누면 계산이 길어집니다. 그 반대쪽인 '한 명도 없다', '하나도 없다'는 대개 한 가지 경우뿐입니다. 이 절에서는 사건 A가 일어나지 않는 사건인 여사건을 정의하고, P(A<sup>c</sup>) = 1 − P(A)를 써서 어려운 계산을 쉬운 계산으로 바꿉니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">확률의 덧셈정리</span><span class="p">배반사건</span><span class="p">순열과 조합</span>
</div>
