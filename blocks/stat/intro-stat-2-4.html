<p class="lead">같은 '지각할 확률'이라도 버스로 다니는 학생만 놓고 보면 값이 달라질 수 있습니다. 어떤 사건이 일어났다는 정보가 주어지면, 따져 볼 대상이 그 사건 안으로 좁혀지기 때문입니다. 이 절에서는 조건이 주어진 상황의 가능성을 수로 나타낸 조건부확률을 정의하고, 의료 검사처럼 실생활에서 조건부확률을 잘못 읽기 쉬운 경우를 살펴봅니다.</p>
