<p class="lead">지금까지 각은 두 반직선이 벌어진 정도라서 0°에서 360° 사이였습니다. 바퀴나 지구처럼 계속 도는 것을 다루려면 몇 바퀴를 어느 방향으로 돌았는지까지 담는 각이 필요합니다. 이 절에서는 회전한 양으로 각을 정하는 일반각을 배우고, 각을 호의 길이와 반지름의 비로 재는 호도법으로 각을 실수처럼 다룰 준비를 합니다.</p>
