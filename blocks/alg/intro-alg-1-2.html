<p class="lead">지수가 자연수일 때 <i>a</i><sup><i>n</i></sup>은 "<i>a</i>를 <i>n</i>번 곱한 수"입니다. 그런데 "0번 곱한 수", "−2번 곱한 수", "1/2번 곱한 수"는 무엇일까요? 이 절에서는 지수법칙이 계속 성립하도록 뜻을 정하는 방법으로 지수를 0과 음의 정수, 유리수, 실수까지 넓힙니다. 그 과정에서 밑이 양수여야 하는 까닭도 확인합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">자연수 지수의 지수법칙</span><span class="p">거듭제곱근과 그 성질</span><span class="p">유리수와 무리수</span>
</div>
