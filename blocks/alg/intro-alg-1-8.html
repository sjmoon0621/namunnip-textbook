<p class="lead">지수함수와 로그함수는 늘 증가하거나 늘 감소합니다. 그래서 같은 밑끼리는 지수나 진수만 비교하면 방정식과 부등식을 풀 수 있습니다. 다만 밑이 1보다 작으면 부등호의 방향이 바뀌고, 로그에서는 진수가 양수여야 합니다. 이 절에서는 이 두 가지를 그래프로 확인하고, 반감기·복리·세균 증식처럼 일정한 비율로 변하는 현상에서 원하는 양이 되기까지 걸리는 시간을 로그로 구합니다.</p>
