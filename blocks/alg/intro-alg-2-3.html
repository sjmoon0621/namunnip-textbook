<p class="lead">강 건너 나무까지의 거리나 산을 뚫는 터널의 길이처럼 직접 잴 수 없는 거리가 있습니다. 이런 거리는 잴 수 있는 변과 각으로 삼각형을 만들어 계산합니다. 이 절에서는 삼각형의 변과 각 사이의 관계인 사인법칙과 코사인법칙을 세우고, 이를 이용해 높이를 재지 않고 넓이를 구합니다.</p>
