<p class="lead">앞의 절들에서 ∑<i>k</i><sup>2</sup> 같은 공식을 몇 개의 <i>n</i>으로 확인하거나 그림으로 보였습니다. 그런데 자연수는 끝이 없으니 하나씩 확인해서는 모든 <i>n</i>을 다룰 수 없습니다. 이 절에서는 두 가지만 보이면 모든 자연수에서 명제가 성립함을 보장하는 수학적 귀납법을 도미노로 이해하고, 간단한 등식을 직접 증명해 봅니다.</p>
