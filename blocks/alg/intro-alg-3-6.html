<p class="lead">도미노의 첫 조각과 '앞 조각이 넘어지면 다음 조각이 넘어진다'는 규칙만 알면 모든 조각의 운명이 정해집니다. 수열도 그렇습니다. 이 절에서는 일반항 대신 첫째항과 이웃한 항 사이의 관계로 수열을 정하는 방법을 익히고, 세는 문제를 이런 관계식으로 나타내 봅니다.</p>
