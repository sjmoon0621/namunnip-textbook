<p class="lead">우리가 쓰는 수는 십진법이므로 밑이 10인 로그가 가장 편합니다. 이것을 상용로그라 합니다. 상용로그의 정수 부분은 수의 자릿수를, 소수 부분은 맨 앞의 숫자들을 알려 줍니다. 이 절에서는 \(2^{50}\) 같은 큰 수를 직접 계산하지 않고 몇 자리인지 알아내고, 몇 배씩 차이 나는 양을 다루기 쉬운 수로 바꾼 산성도, 지진 규모, 소리의 세기를 상용로그로 읽습니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">로그의 뜻</span><span class="p">로그의 성질</span><span class="p">과학적 표기 \(a \times 10^n\)</span>
</div>
