<p class="lead">1 + 2 + … + <i>n</i>은 등차수열의 합으로 구했습니다. 그렇다면 1<sup>2</sup> + 2<sup>2</sup> + … + <i>n</i><sup>2</sup>이나 1<sup>3</sup> + 2<sup>3</sup> + … + <i>n</i><sup>3</sup>은 어떻게 구할까요? 이 절에서는 이웃한 항끼리 지워지게 늘어놓는 방법과 정사각형 그림으로 이 합들의 공식을 찾고, 분수 꼴 수열의 합에도 같은 생각을 씁니다.</p>
