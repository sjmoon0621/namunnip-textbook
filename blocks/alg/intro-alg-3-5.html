<p class="lead">\(1 + 2 + \cdots + n\)은 등차수열의 합으로 구했습니다. 그렇다면 \(1^2 + 2^2 + \cdots + n^2\)이나 \(1^3 + 2^3 + \cdots + n^3\)은 어떻게 구할까요? 이 절에서는 이웃한 항끼리 지워지게 늘어놓는 방법과 정사각형 그림으로 이 합들의 공식을 찾고, 분수 꼴 수열의 합에도 같은 생각을 씁니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">\(\sum\)의 뜻과 성질</span><span class="p">등차수열의 합</span><span class="p">곱셈 공식 \((a + b)^3\)</span><span class="p">분수식의 계산</span>
</div>
