<p class="lead">\(1 + 3 + 5 + \cdots + 99\)처럼 긴 합을 매번 늘어놓아 쓰기는 번거롭습니다. 이 절에서는 이런 합을 기호 \(\sum\) 하나로 짧게 쓰는 방법과, \(\sum\)끼리 더하거나 상수를 곱할 때 쓸 수 있는 성질을 익힙니다. 곱에 대해서는 같은 성질이 왜 성립하지 않는지도 그림으로 확인합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">수열과 일반항</span><span class="p">등차수열과 등비수열의 합</span><span class="p">분배법칙</span>
</div>
