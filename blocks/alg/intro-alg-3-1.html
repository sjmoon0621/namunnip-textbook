<p class="lead">\(1, 3, 5, 7, \cdots\)처럼 수를 차례로 늘어놓은 것을 수열이라고 합니다. 이 절에서는 '차례'가 무엇을 뜻하는지 함수로 다시 보고, 수열을 기호 \(a_n\)으로 적는 방법을 익힙니다. 처음 몇 항만 보고 다음 항을 단정할 수 있는지도 따져 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">함수의 뜻</span><span class="p">정의역과 치역</span><span class="p">일차함수와 이차함수의 그래프</span>
</div>
