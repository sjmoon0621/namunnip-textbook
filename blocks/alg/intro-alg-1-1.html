<p class="lead">같은 수를 여러 번 곱한 것이 거듭제곱입니다. 거꾸로 "n번 곱해서 a가 되는 수는 무엇인가"를 물으면 거듭제곱근이 나옵니다. 이 절에서는 \(x^n = a\)의 실근이 몇 개인지 그래프로 세어 보고, 거듭제곱근끼리 곱하고 나누고 거듭제곱하는 성질을 양변을 비교해 확인합니다.</p>
