<p class="lead">닫힌구간에서 끊기지 않은 그래프는 어딘가에서 가장 높고 어딘가에서 가장 낮습니다. 아래에서 위로 이어진 그래프는 그 사이의 높이를 모두 지납니다. 당연해 보이는 이 두 사실이 최대·최소 정리와 사잇값 정리입니다. 이 절에서는 조건 하나를 빼면 결론이 깨지는 예를 직접 만들어 보고, 사잇값 정리로 방정식의 근이 있는 구간을 찾아 좁혀 갑니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
