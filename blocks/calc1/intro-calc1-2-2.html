<p class="lead">미분계수는 극한값이므로 언제나 있는 것은 아닙니다. 그래프가 뾰족하게 꺾이거나 끊어진 곳에서는 왼쪽에서 다가갈 때와 오른쪽에서 다가갈 때 평균변화율이 서로 다른 값으로 갑니다. 이 절에서는 미분가능하면 반드시 연속이라는 사실과, 연속이라고 해서 미분가능하지는 않다는 사실을 확인합니다. 그리고 두 식을 이어 붙인 함수가 매끄럽게 이어질 조건을 찾습니다.</p>
