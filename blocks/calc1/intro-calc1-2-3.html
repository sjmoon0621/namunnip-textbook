<p class="lead">미분계수 \(f'(a)\)는 점 하나에서의 기울기입니다. \(a\)를 바꿀 때마다 기울기도 바뀌므로, 기울기 자체를 \(x\)의 함수로 볼 수 있습니다. 이것이 도함수입니다. 이 절에서는 \((x + h)^n\)을 전개해 \(y = x^n\)의 도함수가 \(nx^{n-1}\)임을 보이고, 접선의 기울기를 하나씩 찍어 도함수의 그래프를 직접 만들어 봅니다.</p>
