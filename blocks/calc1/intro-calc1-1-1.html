<p class="lead">구멍이 뚫린 그래프를 생각해 봅시다. 그 점의 함숫값은 없지만, 그 점에 다가갈수록 그래프의 높이가 어디로 가는지는 분명히 보입니다. 이 절에서는 \(x\)가 어떤 값에 한없이 가까워질 때 함숫값이 한 값에 한없이 가까워지는 현상을 극한이라는 말과 기호로 정리합니다. 왼쪽과 오른쪽에서 따로 다가가 보고, 함숫값이 한없이 커지거나 \(x\)가 한없이 커지는 경우도 살펴봅니다.</p>
