<p class="lead">그래프를 왼쪽에서 오른쪽으로 따라가면 오르막과 내리막이 번갈아 나옵니다. 그래프를 다 그리지 않고도 어디가 오르막인지 알 수 있을까요? 이 절에서는 접선의 기울기, 곧 도함수의 부호로 함수의 증가와 감소를 판정합니다. 오르막이 내리막으로 바뀌는 봉우리와 내리막이 오르막으로 바뀌는 골짜기를 극대와 극소라고 부르고, 이를 찾는 방법을 증감표로 정리합니다.</p>
