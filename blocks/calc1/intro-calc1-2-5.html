<p class="lead">미분계수 f′(<i>a</i>)는 점 (<i>a</i>, f(<i>a</i>))에서 그은 접선의 기울기입니다. 직선은 기울기와 지나는 한 점만 알면 정해지므로, 미분할 수 있으면 접선의 방정식을 바로 쓸 수 있습니다. 이 절에서는 접점을 알 때, 기울기를 알 때, 곡선 밖의 한 점을 지날 때로 나누어 접선을 구합니다. 세 경우 모두 열쇠는 접점의 좌표를 정하는 것입니다.</p>

</div>
