<p class="lead">\(y = x^n\)의 도함수를 알면 다항함수는 거의 다 미분할 수 있습니다. 다항함수는 \(x^n\)에 수를 곱하고 더한 것이기 때문입니다. 이 절에서는 실수배와 합, 차를 미분하면 각각의 도함수에 같은 계산을 하면 된다는 것을 확인합니다. 그리고 두 함수의 곱은 도함수끼리 곱해서는 안 되는 까닭을 직사각형의 넓이로 살펴봅니다.</p>
