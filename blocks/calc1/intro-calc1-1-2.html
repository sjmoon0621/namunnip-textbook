<p class="lead">극한값을 매번 표를 만들어 짐작할 수는 없습니다. 이 절에서는 극한값이 있는 두 함수를 더하고 곱하고 나눌 때 극한값도 그대로 더하고 곱하고 나누어진다는 성질을 확인합니다. 그리고 그대로 대입하면 0/0이나 ∞/∞이 되는 식을 약분, 유리화, 최고차항으로 나누기로 고쳐 극한값을 구합니다.</p>
