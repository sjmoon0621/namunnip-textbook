<p class="lead">물체에는 보통 힘이 여러 개 작용하고, 그 방향도 제각각입니다. 방향이 다른 힘들을 어떻게 더해야 물체가 어느 쪽으로 얼마나 빨리 움직일지 알 수 있을까요? 힘을 화살표(벡터)로 보고 성분으로 나누어 더하는 방법을 익힙니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
