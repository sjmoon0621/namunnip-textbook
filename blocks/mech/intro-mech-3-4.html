<p class="lead">스피커 두 대에서 같은 소리가 나오면, 방 안의 어떤 자리에서는 소리가 커지고 어떤 자리에서는 거의 들리지 않습니다. 두 파동이 만나 서로 더해지거나 지워지기 때문입니다. 소리로 소리를 지우는 노이즈 캔슬링 이어폰이 바로 이 원리를 씁니다.</p>
