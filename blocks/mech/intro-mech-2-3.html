<p class="lead">기체에 열을 주면 온도가 오를 수도 있고, 피스톤을 밀어 일을 할 수도 있습니다. 반대로 자전거 펌프로 공기를 세게 누르면 펌프가 뜨거워집니다. 열, 일, 내부 에너지는 서로 바뀔 뿐 전체는 보존됩니다. 이것이 열역학 제1법칙입니다.</p>
