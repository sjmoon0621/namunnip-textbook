<p class="lead">겨울에 난방한 집에서 열은 끊임없이 밖으로 빠져나갑니다. 벽을 통해, 창틈의 공기를 타고, 유리창을 지나는 복사로 빠져나갑니다. 열이 어떤 길로 이동하는지 알면 그 길을 막는 방법, 곧 단열을 설계할 수 있습니다. 온도가 바뀌면 물체의 크기도 바뀌므로, 다리와 철로는 그만큼의 틈을 두고 만듭니다.</p>
