<p class="lead">소금, 얼음, 다이아몬드, 구리는 모두 고체지만 성질은 전혀 다릅니다. 입자를 붙잡는 힘이 이온 결합인지, 분자 사이의 약한 힘인지, 공유 결합의 그물인지, 금속 결합인지에 따라 녹는점, 단단함, 전기 전도성이 정해집니다. 유리처럼 입자가 불규칙하게 굳은 고체도 있습니다.</p>
