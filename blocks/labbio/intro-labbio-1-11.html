<p class="lead">빵 반죽이 부풀고 막걸리에 거품이 이는 것은 효모가 당을 발효해 이산화 탄소를 내놓기 때문입니다. 효모에게 어떤 당을 얼마나, 몇 도에서 주어야 발효가 가장 활발할까요? 발효관에 모이는 기체의 부피로 비교하는 실험을 직접 설계해 봅시다.</p>
