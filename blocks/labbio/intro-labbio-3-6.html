<p class="lead">1910년 모건의 실험실에서 붉은 눈 초파리 무리 속에 흰 눈 수컷 한 마리가 나타났고, 이 한 마리에서 염색체 유전 연구가 시작되었습니다. 교배 실험을 하려면 먼저 초파리의 암수와 형질을 정확히 가려내야 합니다. 마취한 초파리를 해부 현미경으로 들여다봅니다.</p>
