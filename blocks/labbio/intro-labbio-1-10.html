<p class="lead">살아 있는 씨앗은 겉으로는 가만히 있어도 쉬지 않고 숨을 쉽니다. 씨앗이 쓰는 산소는 아주 적지만, 이산화 탄소를 흡수시키고 가는 관 속 색소 방울을 지켜보면 0.01 mL 단위까지 잴 수 있습니다. 가설을 세우고, 싹 트는 콩과 마른 콩, 낮은 온도와 높은 온도의 호흡 속도를 비교해 봅시다.</p>
