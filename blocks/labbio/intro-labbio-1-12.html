<p class="lead">혈액을 가는 유리관에 담아 세게 돌리면 붉은 층과 노란 층으로 깔끔하게 나뉩니다. 붉은 층의 길이를 자로 재는 것만으로 빈혈이나 고산 적응을 짐작할 수 있습니다. 모의 혈액으로 적혈구 용적률을 재고, 적혈구가 산소를 나르기에 왜 그런 모양과 구조를 갖는지 조사해 봅시다.</p>
