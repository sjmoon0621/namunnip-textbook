<p class="lead">보통 염색체는 1000배로 보아도 몇 µm에 불과하지만, 초파리 애벌레 침샘의 염색체는 400배에서도 줄무늬까지 또렷하게 보입니다. 이 거대한 염색체 덕분에 유전자의 위치를 처음으로 눈으로 지도에 그릴 수 있었습니다. 왜 이렇게 커졌는지 일반 염색체와 비교해 봅니다.</p>
