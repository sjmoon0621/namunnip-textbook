<p class="lead">1897년 톰슨은 음극선이 전기와 자기장에서 휘는 정도를 재어, 그 입자의 전하를 질량으로 나눈 값이 수소 이온보다 천 배 넘게 크다는 것을 알아냈습니다. 전자의 질량을 직접 저울에 달 수는 없지만, 빔이 그리는 원의 크기를 자로 재면 e/m을 구할 수 있습니다. 헬름홀츠 코일 안에서 빛나는 전자 고리를 재 봅시다.</p>
