<p class="lead">금속 원기둥의 밀도는 질량, 지름, 높이 세 값을 재어 계산합니다. 세 값 가운데 하나만 조금 틀려도 밀도는 틀어집니다. 어느 값을 더 정밀하게 재야 할까요? 이 절에서는 정확한 측정과 정밀한 측정이 어떻게 다른지 보고, 각 측정의 오차가 계산 결과에 어떻게 옮겨 가는지 따져 봅니다.</p>
