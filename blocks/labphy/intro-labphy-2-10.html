<p class="lead">1 cal는 물 1 g을 1 °C 올리는 열이고, 1 J은 1 N의 힘으로 1 m를 미는 일입니다. 서로 다른 방식으로 정의한 두 단위가 같은 양을 재고 있다면 둘 사이의 환산 비율이 있어야 합니다. 손잡이를 돌려 한 일과 올라간 온도로 그 비율을 재 봅시다.</p>
