<p class="lead">제곱해서 \(-1\)이 되는 실수는 없습니다. 그래서 \(x^2 = -1\) 같은 방정식은 실수 범위에서 풀리지 않습니다. 이 절에서는 제곱하면 \(-1\)이 되는 새로운 수 \(i\)를 약속하고, \(a + bi\) 꼴의 복소수로 수의 범위를 넓힙니다. 넓힌 수에서도 실수에서 쓰던 계산 법칙이 그대로 통하는지 직접 계산해 보고, 나눗셈은 켤레복소수로 해결합니다.</p>

  <span class="mono">먼저 알면 좋은 것</span>

</div>
