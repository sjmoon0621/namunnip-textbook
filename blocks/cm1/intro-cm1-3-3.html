<p class="lead">대표 3명을 뽑을 때는 누가 먼저 뽑혔는지가 중요하지 않습니다. 이렇게 순서를 따지지 않고 뽑는 경우의 수가 조합입니다. 이 절에서는 순열 목록에서 같은 사람들로 이루어진 나열을 한데 묶어, 조합의 수가 순열의 수를 <i>r</i>!로 나눈 값인 까닭을 확인합니다. 이어서 <i>r</i>를 바꿀 때 조합의 수가 어떻게 변하는지 보고, 대칭과 '특정한 하나를 넣느냐 빼느냐'로 나누는 관계를 찾습니다.</p>
