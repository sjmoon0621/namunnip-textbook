<p class="lead">\(|x - 1| &lt; 3\)은 '\(x\)와 1 사이의 거리가 3보다 작다'는 뜻입니다. 이렇게 거리로 읽으면 해가 바로 보입니다. 절댓값이 두 개 이상이면 거리만으로는 어렵기 때문에, 절댓값 기호 안이 0이 되는 값을 경계로 범위를 나누고 각 범위에서 일차부등식을 풉니다. 이 절에서는 두 방법을 그래프와 수직선으로 비교합니다.</p>
