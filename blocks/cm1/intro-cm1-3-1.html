<p class="lead">경우의 수를 셀 때 지켜야 할 것은 두 가지입니다. 빠뜨리지 않고, 두 번 세지 않는 것입니다. 이 절에서는 주사위 두 개의 결과 표에서 '또는'으로 이어진 두 사건을 세어 언제 더하면 되는지 확인합니다. 다음으로 수형도의 가지가 어떻게 불어나는지 보며 '이어서' 일어나는 일을 곱으로 세는 까닭을 찾습니다. 마지막으로 이 두 법칙으로 약수의 개수를 나열하지 않고 구합니다.</p>
