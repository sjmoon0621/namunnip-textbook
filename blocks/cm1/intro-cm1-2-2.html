<p class="lead">근의 공식에서 √ 안의 값이 음수가 되면 실수 범위에서는 근이 없습니다. 하지만 복소수까지 수를 넓히면 그 이차방정식도 근을 갖습니다. 이 절에서는 √ 안의 값 <i>b</i><sup>2</sup> − 4<i>ac</i> 하나로 근이 실근인지 허근인지, 서로 다른지 같은지를 판별하고, 계수를 바꿀 때 두 실근이 만나 허근으로 갈라지는 모습을 봅니다.</p>
