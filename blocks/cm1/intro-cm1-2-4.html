<p class="lead">이차방정식 \(ax^2 + bx + c = 0\)의 실근은 이차함수 \(y = ax^2 + bx + c\)에서 \(y\)가 0이 되는 \(x\)입니다. 그래서 방정식을 풀지 않고 그래프만 보아도 실근이 몇 개인지 알 수 있고, 거꾸로 판별식만 보아도 그래프가 \(x\)축과 몇 번 만나는지 알 수 있습니다. 이 절에서는 꼭짓점을 움직이며 두 관점을 잇고, \(x\)축 대신 수평선 \(y = k\)와 만나는 경우로 넓혀 봅니다.</p>

</div>
