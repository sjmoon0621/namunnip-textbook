<p class="lead">이차방정식 <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i> = 0의 실근은 이차함수 <i>y</i> = <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i>에서 <i>y</i>가 0이 되는 <i>x</i>입니다. 그래서 방정식을 풀지 않고 그래프만 보아도 실근이 몇 개인지 알 수 있고, 거꾸로 판별식만 보아도 그래프가 <i>x</i>축과 몇 번 만나는지 알 수 있습니다. 이 절에서는 꼭짓점을 움직이며 두 관점을 잇고, <i>x</i>축 대신 수평선 <i>y</i> = <i>k</i>와 만나는 경우로 넓혀 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">이차함수의 그래프와 꼭짓점</span><span class="p">판별식</span><span class="p">근과 계수의 관계</span>
</div>
