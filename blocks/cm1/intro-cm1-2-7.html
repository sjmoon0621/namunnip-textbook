<p class="lead">이차방정식은 근의 공식으로 언제나 풀 수 있습니다. 차수가 3, 4로 올라가면 고등학교에서 쓸 만한 공식이 없으므로, 인수분해해서 차수를 낮추는 방법을 씁니다. 이 절에서는 인수정리로 근 하나를 찾고 조립제법으로 나누어 이차방정식으로 줄이는 과정을 따라가고, \(x^2\)을 한 문자로 바꾸어 사차방정식을 이차방정식처럼 푸는 방법을 그래프로 확인합니다.</p>
