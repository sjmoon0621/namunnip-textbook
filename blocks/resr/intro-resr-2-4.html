<p class="lead">실험실에서 적은 숫자는 그대로는 아무 말도 하지 않습니다. 날마다 쓴 연구 일지를 정리해 표로 묶고, 알맞은 축과 오차 막대를 골라 그래프로 그려야 비로소 변인 사이의 관계가 보입니다. 같은 자료도 어떻게 그리느냐에 따라 보이는 것이 달라집니다.</p>

  <span class="mono">먼저 알면 좋은 것</span>
