<p class="lead">철이 녹스는 일, 숯이 타는 일, 우리 몸이 음식에서 에너지를 꺼내는 일은 모두 같은 종류의 반응입니다. 한쪽이 산소나 전자를 내주면 다른 쪽이 그것을 받습니다. 이 절에서는 ‘누가 주고 누가 받는가’를 따라가 봅니다.</p>
