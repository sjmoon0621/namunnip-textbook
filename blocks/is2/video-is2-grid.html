<section class="video-block" id="video-is2-grid" aria-label="전기의 여행 영상">
  <div>
    <span class="mono">영상 · 30초</span>
    <h2>콘센트까지 오는 전기의 여행</h2>
    <p>발전기에서 나온 전기는 전압을 몇 번이나 바꾸며 집까지 옵니다. 위쪽 사다리 그래프로 전압이 오르내리는 과정을 따라가 봅니다. 전압 값은 우리나라 전력망에서 쓰는 대표값입니다. 이 영상도 코드로 그려집니다.</p>
  </div>
  <div class="phone">
    <canvas width="360" height="640" aria-label="발전기, 변압기, 송전선, 변전소, 주상 변압기, 콘센트로 이어지는 전압 변화를 보여 주는 짧은 애니메이션"></canvas>
    <button class="reel-play" type="button" aria-label="재생"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="reel-bar">
      <button class="reel-toggle mono" type="button">일시정지</button>
      <input class="reel-seek" type="range" min="0" max="1000" value="0" aria-label="영상 위치">
      <span class="reel-time mono">0:00</span>
    </div>
  </div>
</section>
