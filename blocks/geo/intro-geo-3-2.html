<p class="lead">벡터는 화살표로 그려서 생각할 수도 있고, 좌표 같은 수의 묶음으로 계산할 수도 있습니다. 기준점 O를 하나 정하면 모든 점이 O에서 출발하는 벡터 하나와 짝지어지고, 그 벡터는 다시 좌표 성분으로 쓸 수 있습니다. 이 절에서는 그림으로 하던 벡터의 연산을 좌표의 계산으로 바꾸는 방법을 평면과 공간에서 확인합니다.</p>
