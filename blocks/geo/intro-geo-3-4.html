<p class="lead">직선은 '한 점'과 '나아가는 방향'만 알면 정해집니다. 이 두 가지를 위치벡터와 방향벡터로 쓰면 직선 위의 모든 점을 실수 하나 <i>t</i>로 나타낼 수 있습니다. 이 절에서는 좌표평면에서 직선을 벡터로 표현하는 두 방법을 익히고, 같은 식이 좌표공간의 직선에도 그대로 쓰인다는 것을 확인합니다.</p>
