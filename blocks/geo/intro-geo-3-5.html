<p class="lead">좌표평면에서 점 하나와 법선벡터로 쓴 식은 직선이었습니다. 같은 식을 좌표공간에서 쓰면 무엇이 될까요? 또 원을 '중심에서 거리가 일정한 점'으로 나타냈듯이, 공간에서 같은 조건은 구가 됩니다. 이 절에서는 벡터의 내적과 크기로 평면과 구를 짧은 식 하나로 나타내고, 그 식을 좌표로 풀어 봅니다.</p>
