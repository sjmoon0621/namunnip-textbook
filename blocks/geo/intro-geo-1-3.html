<p class="lead">타원에서 거리의 합을 차로 바꾸면 전혀 다른 곡선이 나옵니다. 서로 떨어진 두 가지가 끝없이 뻗어 나가며, 멀리 갈수록 두 직선에 붙어 갑니다. 이 절에서는 쌍곡선의 방정식을 타원과 같은 방법으로 세우고, 타원과 무엇이 같고 무엇이 다른지 비교합니다. 이어서 곡선이 가까워지는 직선인 점근선을 식에서 찾습니다.</p>
