<p class="lead">원과 직선이 접하는 조건을 판별식으로 찾았던 것처럼, 포물선·타원·쌍곡선의 접선도 직선의 식을 대입한 이차방정식에서 찾을 수 있습니다. 이 절에서는 기울기가 주어진 접선과 곡선 위의 점에서 그은 접선을 구하고, 두 방법에서 얻은 식이 원의 접선 공식과 같은 모양이라는 것을 확인합니다. 마지막으로 접선이 만드는 반사 성질이 안테나와 의료 장비에 어떻게 쓰이는지 읽습니다.</p>
