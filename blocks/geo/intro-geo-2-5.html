<p class="lead">원은 한 점에서 거리가 같은 평면 위의 점들이었고, 거리 공식으로 원의 방정식을 얻었습니다. 공간에서 한 점까지 거리가 같은 점들은 구를 이룹니다. 이 절에서는 공간의 거리 공식으로 구의 방정식을 세우고, 전개된 식에서 중심과 반지름을 되찾으며, 구를 평면으로 자른 단면이 어떤 원인지 계산합니다.</p>
