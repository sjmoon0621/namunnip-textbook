<p class="lead">두 변환을 잇따라 하면 하나의 변환이 되고, 그 행렬은 두 행렬의 곱입니다. 행렬의 곱은 순서를 바꾸면 달라질 수 있으므로, 변환을 하는 순서를 꼭 따져야 합니다. 변환을 거꾸로 되돌리는 <em>역변환</em>의 행렬은 역행렬입니다. 이 절에서는 두 변환의 순서를 바꾼 결과를 예측해 보고, 뒤틀린 그림을 제자리로 되돌리는 행렬을 찾아봅니다.</p>
