<p class="lead">모든 변을 한 번씩 지나는 길과 모든 꼭짓점을 한 번씩 지나는 길은 비슷해 보이지만 전혀 다른 문제입니다. 앞의 것(<em>오일러 회로</em>)은 차수만 보면 바로 판단할 수 있지만, 뒤의 것(<em>해밀턴 회로</em>)은 그런 간단한 조건이 알려져 있지 않습니다. 이 절에서는 한붓그리기와 해밀턴의 이코시안 게임에 도전하며 두 문제의 차이를 느껴 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">꼭짓점의 차수와 변의 개수</span><span class="p">그래프와 실생활 문제</span>
