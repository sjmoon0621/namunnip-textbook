<p class="lead">보어는 수소의 선 스펙트럼을 설명하려고 궤도를 양자화했고, 슈뢰딩거는 전자를 파동 방정식으로 다루어 같은 결과를 더 일반적으로 얻었습니다. 이 방정식을 가장 단순한 상자에 적용하면 에너지 준위가 저절로 나오고, 상자를 여러 개 이어 붙이면 반도체의 에너지띠가 나옵니다. 상자를 나노미터 크기로 직접 만드는 기술이 나노 물리학입니다.</p>
