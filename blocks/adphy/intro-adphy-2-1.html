<p class="lead">쿨롱 법칙만 있으면 어떤 전하 분포의 전기장도 구할 수 있지만, 전하가 수없이 많으면 더하는 일이 끝나지 않습니다. 닫힌 면을 뚫고 나가는 전기력선의 수만 세면 대칭이 있는 분포의 전기장을 한 줄로 얻는 방법이 있습니다. 같은 생각으로 금속 상자 속이 왜 안전한지, 알짜 전하가 0인 분자가 왜 전기장에 반응하는지도 설명할 수 있습니다.</p>
