<p class="lead">반응식은 처음과 끝만 보여 줍니다. NO₂ + CO → NO + CO₂ 반응의 속도는 CO의 농도와 상관이 없는데, 반응식만 보면 그 까닭을 알 수 없습니다. 반응이 실제로 거치는 단계들을 떠올리고, 그중 가장 느린 단계가 전체를 어떻게 붙잡아 두는지 확인해 봅니다.</p>
