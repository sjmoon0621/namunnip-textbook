<p class="lead">농도를 2배로 하면 충돌도 2배가 되어 속도가 2배쯤 빨라집니다. 그런데 온도를 10 K 올리면 분자는 2%도 채 빨라지지 않는데(300 K 근처에서 약 1.7%) 반응은 2배 넘게 빨라지기도 합니다. 이 차이를 충돌의 수와 충돌의 질로 나누어 살펴봅니다.</p>
