<p class="lead">알루미늄 캔 하나를 광석에서 새로 만들려면 상당한 양의 전기가 들고, 그래서 재활용이 큰 의미를 갖습니다. 전기 분해는 화학 전지를 거꾸로 돌려 ΔG &gt; 0인 반응을 억지로 일으키는 일입니다. 이 절에서는 전압을 얼마나 걸어야 반응이 시작되는지, 그리고 전하를 얼마나 흘려야 원하는 양의 물질을 얻는지를 계산합니다.</p>
