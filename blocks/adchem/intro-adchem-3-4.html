<p class="lead">우주의 엔트로피로 자발성을 판단하려면 계와 주위를 모두 계산해야 해서 번거롭습니다. 온도와 압력이 일정한 실험실에서는 계의 양만으로 같은 판단을 내릴 수 있는 함수가 있습니다. 석회석을 몇 도로 가열해야 생석회가 되는지도 이 함수 하나로 예측할 수 있습니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>

</div>
