<p class="lead">새 건전지는 1.5 V를 내지만 다 쓴 건전지는 전압이 거의 0입니다. 안의 물질이 남아 있는데도 전압이 사라지는 까닭은 무엇일까요? 전지의 전압은 반응의 자유 에너지를 전하로 나눈 값이고, 반응이 평형에 다가갈수록 꺼낼 수 있는 자유 에너지가 줄어듭니다.</p>
