<p class="lead">과망가니즈산 이온이 철(II) 이온을 만나면 보라색이 사라집니다. 이 반응식은 계수를 하나씩 넣어 보는 방법으로는 좀처럼 맞지 않습니다. 원자들이 주고받은 전자를 장부처럼 세는 산화수를 쓰면, 복잡한 반응식도 정해진 순서대로 맞출 수 있습니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">전기 음성도</span><span class="p">산화·환원과 전자의 이동</span><span class="p">질량 보존과 전하 보존</span>
</div>
