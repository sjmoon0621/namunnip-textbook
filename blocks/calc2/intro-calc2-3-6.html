<p class="lead">넓이를 가는 직사각형의 합으로 구했듯이, 부피는 입체를 얇게 썬 조각의 합으로 구합니다. 조각 하나의 부피는 (단면의 넓이) × (두께)이므로, 단면의 넓이를 <i>x</i>의 함수 S(<i>x</i>)로 나타낼 수 있으면 부피는 S(<i>x</i>)의 정적분이 됩니다. 이 절에서는 여러 모양의 단면을 가진 입체의 부피를 구하고, 입체를 비스듬히 밀어도 부피가 그대로인 까닭을 단면으로 설명합니다.</p>
