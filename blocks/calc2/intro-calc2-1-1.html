<p class="lead">1, 1/2, 1/3, 1/4, …처럼 끝없이 이어지는 수열은 마지막 항이 없습니다. 그래도 항들이 어디로 향하는지는 말할 수 있습니다. 이 절에서는 <i>n</i>이 한없이 커질 때 수열의 항이 한 값에 한없이 가까워지는 것을 수렴이라는 말과 lim 기호로 정리합니다. 수렴하지 않는 수열은 양의 무한대로 발산, 음의 무한대로 발산, 진동의 세 갈래로 나누어 판정합니다.</p>
