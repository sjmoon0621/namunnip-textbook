<p class="lead">앞 단원에서는 위치를 미분해 속도를 구했습니다. 이 절에서는 거꾸로 속도를 적분해 위치와 움직인 거리를 구합니다. 수직선 위에서 방향을 바꾸는 운동은 변위와 움직인 거리가 왜 다른지 넓이로 확인합니다. 평면 위를 움직이는 점은 속력을 적분해 움직인 거리, 곧 지나간 곡선의 길이를 구합니다. 계기판의 속력만 기록해도 달린 거리를 알 수 있다는 것이 적분의 쓸모입니다.</p>
