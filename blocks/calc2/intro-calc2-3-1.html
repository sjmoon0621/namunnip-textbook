<p class="lead">미적분Ⅰ에서는 다항함수만 적분했습니다. 적분은 미분을 거꾸로 하는 일이므로, 앞 단원에서 구한 도함수 공식을 뒤집으면 새 함수들의 부정적분이 나옵니다. 이 절에서는 지수가 실수인 거듭제곱함수, 지수함수, 삼각함수를 적분합니다. 특히 \(x^n\)의 공식이 통하지 않는 \(n = -1\)에서 자연로그가 나타나는 까닭을 넓이로 확인합니다.</p>
