<p class="lead">미적분Ⅰ에서는 다항함수의 접선을 구했습니다. 이제 지수함수, 로그함수, 삼각함수를 미분할 수 있고, 음함수와 매개변수로 나타낸 곡선의 기울기도 구할 수 있습니다. 이 절에서는 이 도구들로 여러 가지 곡선의 접선의 방정식을 구합니다. 어떤 곡선이든 순서는 같습니다. 접점을 문자로 두고, 그 점의 기울기를 구한 뒤, 주어진 조건을 식으로 씁니다.</p>
