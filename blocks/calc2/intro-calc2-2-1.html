<p class="lead">미적분Ⅰ에서는 다항함수만 미분했습니다. 이 절에서는 지수함수와 로그함수를 미분합니다. 먼저 (1 + <i>h</i>)<sup>1/<i>h</i></sup>의 극한으로 새로운 수 <i>e</i>를 정의하고, 밑이 <i>e</i>인 자연로그 ln <i>x</i>를 도입합니다. 그러면 <i>e</i><sup><i>x</i></sup>는 도함수가 자기 자신인 함수가 되고, ln <i>x</i>의 도함수는 1/<i>x</i>가 됩니다. 다른 밑의 지수·로그함수는 ln <i>a</i>를 곱하거나 나누어 처리합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
