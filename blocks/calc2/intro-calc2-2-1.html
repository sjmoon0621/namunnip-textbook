<p class="lead">미적분Ⅰ에서는 다항함수만 미분했습니다. 이 절에서는 지수함수와 로그함수를 미분합니다. 먼저 \((1 + h)^{\frac{1}{h}}\)의 극한으로 새로운 수 \(e\)를 정의하고, 밑이 \(e\)인 자연로그 \(\ln x\)를 도입합니다. 그러면 \(e^x\)는 도함수가 자기 자신인 함수가 되고, \(\ln x\)의 도함수는 \(\frac{1}{x}\)가 됩니다. 다른 밑의 지수·로그함수는 \(\ln a\)를 곱하거나 나누어 처리합니다.</p>
