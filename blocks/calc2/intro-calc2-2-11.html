<p class="lead">미적분Ⅰ에서는 다항함수로 나타낸 직선 운동의 속도와 가속도를 구했습니다. 그런데 용수철에 매달린 물체, 서서히 멈추는 진자, 원을 도는 물체의 위치는 삼각함수와 지수함수로 나타납니다. 이 절에서는 지금까지 배운 미분법으로 이런 운동의 속도와 가속도를 구하고, 평면 위의 운동까지 넓혀 봅니다. 미분 한 번으로 '가속도가 위치에 비례하고 방향은 반대'라는 물리 법칙이 드러나는 것을 확인합니다.</p>
