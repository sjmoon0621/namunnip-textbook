}

<p class="lead">원 위를 도는 점이나 굴러가는 바퀴 위의 한 점처럼, 움직이는 점의 위치는 시각 \(t\)에 대한 두 함수 \(x = f(t)\), \(y = g(t)\)로 나타내기 쉽습니다. 이렇게 매개변수로 나타낸 곡선은 \(y\)를 \(x\)의 식으로 고치기 어려울 때가 많습니다. 이 절에서는 식을 고치지 않고 \(\frac{dy}{dt}\)와 \(\frac{dx}{dt}\)의 비로 접선의 기울기를 구합니다. 다루는 곡선은 간단한 것으로 한정합니다.</p>
