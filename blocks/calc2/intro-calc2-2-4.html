<p class="lead">곱의 도함수가 두 도함수의 곱이 아니었듯이, 몫의 도함수도 두 도함수의 몫이 아닙니다. 이 절에서는 먼저 역수 1/<i>g</i>(<i>x</i>)를 도함수의 정의로 미분하고, 곱의 미분법과 합쳐 몫의 미분법을 얻습니다. 이것으로 유리함수와 <i>x</i><sup>−<i>n</i></sup>, 그리고 tan <i>x</i>를 비롯해 새로 정의하는 sec <i>x</i>, csc <i>x</i>, cot <i>x</i>를 미분합니다.</p>
