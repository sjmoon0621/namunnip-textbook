<p class="lead">증가와 감소만으로는 그래프의 모양이 다 정해지지 않습니다. 똑같이 증가하는 곡선도 점점 가파르게 오를 수 있고, 점점 완만하게 오를 수도 있습니다. 이 절에서는 도함수를 한 번 더 미분한 이계도함수로 곡선이 휘는 방향(볼록)과 휘는 방향이 바뀌는 점(변곡점)을 찾습니다. 그다음 증감, 볼록, 점근선을 모아 지수함수, 로그함수가 섞인 함수의 그래프 개형을 그립니다.</p>
