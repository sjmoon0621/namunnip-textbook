<p class="lead">원금이 매년 1.05배가 되는 예금과 매번 절반씩 남기는 약 성분은 모두 등비수열입니다. 하나는 한없이 커지고 다른 하나는 0으로 줄어듭니다. 이 절에서는 공비 <i>r</i>의 값에 따라 등비수열 {<i>r<sup>n</sup></i>}이 어디로 가는지 판정하고, 수렴할 때 그 극한값을 구합니다. 밑이 다른 거듭제곱이 섞인 식의 극한도 같은 원리로 구합니다.</p>
