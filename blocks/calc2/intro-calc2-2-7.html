<p class="lead">원 <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> = 25나 <i>x</i><sup>3</sup> + <i>x</i>의 역함수처럼, <i>x</i>와 <i>y</i>의 관계는 알지만 <i>y</i>를 <i>x</i>의 식으로 깔끔하게 풀기 어려운 경우가 많습니다. 이 절에서는 식을 풀지 않고 관계식 그대로 미분해 접선의 기울기를 얻습니다. 열쇠는 <i>y</i>를 <i>x</i>의 함수로 보고 합성함수의 미분법을 쓰는 것입니다. 다루는 음함수는 간단한 것으로 한정합니다.</p>
