<p class="lead">1/2 + 1/4 + 1/8 + …처럼 끝없이 더하는 식은 끝까지 더해 볼 수 없습니다. 이 절에서는 처음 <i>n</i>개 항까지의 합인 부분합을 만들고, 부분합의 수열이 수렴하는지로 끝없는 덧셈의 값을 정합니다. 더하는 항이 0으로 가는지가 판정에 어떤 역할을 하는지, 그리고 그것만으로는 왜 부족한지도 살펴봅니다.</p>
