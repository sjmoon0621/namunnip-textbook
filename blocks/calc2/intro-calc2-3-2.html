<p class="lead">\(2x \cos(x^2)\)처럼 합성함수와 그 속함수의 도함수가 곱해진 꼴은 앞 절의 공식만으로는 적분할 수 없습니다. 이 절에서는 합성함수의 미분법을 거꾸로 읽어, 속함수를 새 변수 \(u\)로 바꾸어 적분하는 <em>치환적분법</em>을 배웁니다. 정적분에서는 변수를 바꾸면 적분 구간도 함께 바뀐다는 점을 그림으로 확인합니다.</p>
