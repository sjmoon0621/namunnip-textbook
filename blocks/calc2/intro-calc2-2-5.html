}

<p class="lead">\((2x - 1)^{10}\)을 미분하려고 전개하는 것은 너무 깁니다. 이 함수는 \(u = 2x - 1\)과 \(y = u^{10}\)을 이어 붙인 합성함수입니다. 이 절에서는 \(x\)의 작은 변화가 \(u\)를 거쳐 \(y\)로 전달될 때 변화율이 곱해진다는 사실에서 합성함수의 미분법을 얻습니다. 그리고 이를 써서 \(x^{\sqrt{2}}\)처럼 지수가 실수인 거듭제곱과 \(\ln|f(x)|\)를 미분합니다.</p>
