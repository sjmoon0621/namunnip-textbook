  "description": "합성함수의 미분법 {f(g(x))}′ = f′(g(x))g′(x), dy/dx = (dy/du)(du/dx), (ln|f(x)|)′ = f′(x)/f(x), 실수 지수 거듭제곱 x^r의 도함수 r x^(r−1)과 로그미분법. 두 그래프 사이로 증분 Δx → Δu → Δy가 전달되는 모습을 보는 카드."
}

<p class="lead">(2<i>x</i> − 1)<sup>10</sup>을 미분하려고 전개하는 것은 너무 깁니다. 이 함수는 <i>u</i> = 2<i>x</i> − 1과 <i>y</i> = <i>u</i><sup>10</sup>을 이어 붙인 합성함수입니다. 이 절에서는 <i>x</i>의 작은 변화가 <i>u</i>를 거쳐 <i>y</i>로 전달될 때 변화율이 곱해진다는 사실에서 합성함수의 미분법을 얻습니다. 그리고 이를 써서 <i>x</i><sup>√2</sup>처럼 지수가 실수인 거듭제곱과 ln|<i>f</i>(<i>x</i>)|를 미분합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>

</div>
