<p class="lead">수열의 극한값을 매번 띠를 그려 확인할 수는 없습니다. 이 절에서는 극한값을 아는 간단한 수열을 더하고, 빼고, 곱하고, 나누어 복잡한 수열의 극한값을 구하는 성질을 정리합니다. 이 성질을 쓸 수 있는 조건과, 분자와 분모가 모두 발산할 때 식의 모양을 바꾸는 방법도 다룹니다. 마지막으로 위아래 두 수열 사이에 끼인 수열의 극한을 정하는 대소 관계를 살펴봅니다.</p>
