<p class="lead">급수 가운데 부분합을 식으로 바로 쓸 수 있는 대표적인 것이 등비급수입니다. 이 절에서는 공비가 \(-1\)과 1 사이일 때 등비급수가 수렴하고 그 합이 첫째항과 공비만으로 정해진다는 것을 확인합니다. 이 공식으로 튀는 공이 움직인 거리, 순환소수, 끝없이 되풀이되는 도형처럼 '같은 비율의 반복'이 끝없이 이어지는 상황을 계산합니다.</p>
