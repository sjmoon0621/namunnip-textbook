<p class="lead">미적분Ⅰ에서는 곡선 아래 넓이를 가는 직사각형으로 나누어 정적분을 생각했습니다. 이 절에서는 이 관계를 거꾸로 씁니다. 1/(<i>n</i> + 1) + 1/(<i>n</i> + 2) + ⋯ + 1/(2<i>n</i>)처럼 항이 <i>n</i>개인 합의 극한을, 직사각형 넓이의 합으로 보고 정적분으로 바꾸어 계산합니다. 공학 도구 대신 그림 속 <i>n</i>을 늘려 가며 합이 정적분 값에 다가가는 것을 직접 확인합니다. 이런 방법을 <em>구분구적법</em>이라고도 부릅니다.</p>
