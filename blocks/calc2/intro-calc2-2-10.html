<p class="lead">\(\ln x = kx\)나 \(e^x = x + 2\) 같은 방정식은 식을 변형해 근을 구할 수 없습니다. 그래도 근이 몇 개인지, 대략 어디에 있는지는 그래프로 알 수 있습니다. 이 절에서는 앞 절에서 그린 개형을 써서 방정식의 실근의 개수를 세고, 차의 함수의 최솟값으로 부등식이 늘 성립하는지 판단합니다.</p>
