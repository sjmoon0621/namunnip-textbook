<p><b>리스트</b>는 여러 값을 순서대로 묶어 하나의 이름으로 부르는 자료입니다. 각 값은 자리 번호인 <b>인덱스</b>로 꺼냅니다.</p>
<p>파이썬에서 인덱스는 0부터 시작합니다. 첫 값이 0번이고, 값이 \(n\)개이면 마지막 값의 번호는 \(n - 1\)입니다. 마지막 값은 <code>-1</code>번으로도 꺼낼 수 있습니다.</p>
<p>값을 바꾸거나 더할 수 있고, 반복문과 함께 쓰면 모든 값을 차례로 처리할 수 있습니다.</p>
<div class="ex"><b>예</b> <code>t = [12.1, 12.3, 12.2]</code>에서 <code>t[0]</code>은 12.1, <code>t[2]</code>는 12.2입니다. 값이 3개뿐이므로 <code>t[3]</code>은 없는 자리여서 오류가 납니다.</div>
