<body style="margin:0;background:#333;display:flex;flex-wrap:wrap;gap:6px;width:1900px">
<iframe id="f" style="position:absolute;left:-3000px;width:1440px;height:900px"></iframe>
<script>
const q=new URLSearchParams(location.search), id=q.get('v'), ts=q.get('t').split(',').map(Number);
const f=document.getElementById('f'); f.src=q.get('p');
f.onload=()=>setTimeout(()=>{const d=f.contentDocument,r=d.getElementById(id);
 const tg=r.querySelector('.reel-toggle'), s=r.querySelector('.reel-seek'), src=r.querySelector('canvas');
 if(tg.textContent==='일시정지') tg.click();
 ts.forEach(t=>{s.value=t;s.dispatchEvent(new Event('input'));const c=document.createElement('canvas');c.width=360;c.height=640;c.getContext('2d').drawImage(src,0,0,360,640);document.body.appendChild(c);});
},1500);
</script></body>
