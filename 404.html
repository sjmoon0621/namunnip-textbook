<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 — 나뭇잎</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/namunnip/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Pretendard Variable"; src: url("/namunnip-textbook/assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
    :root { --ink: #202125; --ink-2: #55565b; --rule: #d7d8d2; --paper: #f4f4f1; --card: #fbfbf9; --leaf: #3b7c2a; --q: #4b4fe0; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --ink: #eceded; --ink-2: #b4b6bb; --rule: #34363d; --paper: #15161a; --card: #1c1d22; --leaf: #6fb35a; --q: #8c8ff0; color-scheme: dark; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: var(--ink-2); }
    nav { display: grid; gap: 8px; }
    nav a { display: block; padding: 14px 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 2px; text-decoration: none; font-weight: 700; }
    nav a:hover { border-color: var(--ink-2); }
    .n { color: var(--leaf); } .q { color: var(--q); }
  </style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없어진 페이지입니다. 아래에서 다시 찾아 주세요.</p>
  <nav>
    <a href="/namunnip/">나뭇잎 첫 화면</a>
    <a class="n" href="/namunnip-textbook/">나뭇잎 디지털 교과서 (고등학교)</a>
    <a class="q" href="/namunnip-textbook-univ/">QURI 큐리 (대학 1~3학년)</a>
  </nav>
</main>
</body>
</html>
